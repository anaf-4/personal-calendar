<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>개인일정</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <button id="prevBtn" class="icon-btn" title="이전">‹</button>
        <h1 id="periodLabel">2026년 1월</h1>
        <button id="nextBtn" class="icon-btn" title="다음">›</button>
        <button id="todayBtn" class="today-btn">오늘</button>
      </div>
      <div class="topbar-center">
        <div class="view-switch" id="viewSwitch">
          <button type="button" class="view-btn active" data-view="month">월</button>
          <button type="button" class="view-btn" data-view="week">주</button>
          <button type="button" class="view-btn" data-view="day">일</button>
        </div>
      </div>
      <div class="topbar-right">
        <button id="themeToggleBtn" class="icon-btn" title="테마 전환">🌙</button>
        <button id="addEventBtn" class="primary-btn">+ 새 일정</button>
      </div>
    </header>

    <main class="content">
      <section class="calendar-area">
        <div class="weekdays" id="weekdaysRow">
          <div class="weekday sun">일</div>
          <div class="weekday">월</div>
          <div class="weekday">화</div>
          <div class="weekday">수</div>
          <div class="weekday">목</div>
          <div class="weekday">금</div>
          <div class="weekday sat">토</div>
        </div>
        <div id="monthGrid" class="grid"></div>
        <div id="timeGrid" class="time-grid hidden"></div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-block">
          <div class="sidebar-block-header">
            <h3>카테고리</h3>
            <button id="manageCategoriesBtn" class="link-btn">관리</button>
          </div>
          <ul id="categoryFilter" class="category-filter"></ul>
        </div>
        <div class="sidebar-block sidebar-events">
          <div class="sidebar-header">
            <h2 id="selectedDateLabel">날짜를 선택하세요</h2>
            <button id="addToDayBtn" class="secondary-btn">+ 추가</button>
          </div>
          <ul id="eventList" class="event-list"></ul>
        </div>
      </aside>
    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modalTitle">새 일정</h3>
      <form id="eventForm">
        <label>
          제목
          <input type="text" id="fieldTitle" required maxlength="100" placeholder="일정 제목" />
        </label>
        <label>
          날짜
          <input type="date" id="fieldDate" required />
        </label>
        <div class="time-row">
          <label>
            시작 시간
            <input type="time" id="fieldStart" />
          </label>
          <label>
            종료 시간
            <input type="time" id="fieldEnd" />
          </label>
        </div>
        <label>
          카테고리
          <select id="fieldCategory"></select>
        </label>

        <div class="recurrence-box">
          <label>
            반복
            <select id="fieldFreq">
              <option value="none">반복 안 함</option>
              <option value="daily">매일</option>
              <option value="weekly">매주</option>
              <option value="monthly">매월</option>
              <option value="yearly">매년</option>
            </select>
          </label>
          <div id="recurrenceDetail" class="recurrence-detail hidden">
            <label class="interval-label">
              반복 간격
              <div class="interval-row">
                <span>매</span>
                <input type="number" id="fieldInterval" min="1" max="365" value="1" />
                <span id="intervalUnit">일마다</span>
              </div>
            </label>
            <label>
              반복 종료일 (선택)
              <input type="date" id="fieldUntil" />
            </label>
            <p class="hint-text">반복 일정을 수정하거나 삭제하면 전체 반복 일정에 적용됩니다.</p>
          </div>
        </div>

        <label>
          알림
          <select id="fieldReminder">
            <option value="">알림 없음</option>
            <option value="0">정시</option>
            <option value="5">5분 전</option>
            <option value="10">10분 전</option>
            <option value="30">30분 전</option>
            <option value="60">1시간 전</option>
            <option value="1440">1일 전</option>
          </select>
        </label>

        <label>
          메모
          <textarea id="fieldMemo" rows="3" maxlength="500" placeholder="메모 (선택)"></textarea>
        </label>
        <input type="hidden" id="fieldId" />
        <div class="modal-actions">
          <button type="button" id="deleteBtn" class="danger-btn hidden">삭제</button>
          <div class="modal-actions-right">
            <button type="button" id="cancelBtn" class="secondary-btn">취소</button>
            <button type="submit" class="primary-btn">저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="categoryModalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h3>카테고리 관리</h3>
      <ul id="categoryManageList" class="category-manage-list"></ul>
      <div class="category-add-row">
        <input type="color" id="newCategoryColor" value="#5b8def" />
        <input type="text" id="newCategoryName" placeholder="새 카테고리 이름" maxlength="30" />
        <button type="button" id="addCategoryBtn" class="secondary-btn">추가</button>
      </div>
      <div class="modal-actions">
        <div></div>
        <div class="modal-actions-right">
          <button type="button" id="closeCategoryModalBtn" class="primary-btn">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
